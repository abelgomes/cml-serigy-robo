name: Coletar documentos da Ágape

on:
  schedule:
    - cron: '0 9 * * *'   # todo dia às 9h UTC (6h em Sergipe)
  workflow_dispatch:       # permite rodar na hora, pelo botão "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ler as pastas da Ágape
        run: node robo/coletar-agape.mjs

      - name: Guardar a lista no repositório (histórico)
        run: |
          git config user.name "robo-transparencia"
          git config user.email "robo-transparencia@users.noreply.github.com"
          git add docs/agape.json
          git diff --cached --quiet || git commit -m "Coleta da Ágape: $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar no GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
